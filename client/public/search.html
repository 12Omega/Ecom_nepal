<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Search - ModernShop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: rgba(255,255,255,0.95);
            padding: 20px 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a202c;
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: #667eea;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #1a202c;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .search-section {
            background: #f8fafc;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        
        input:focus {
            border-color: #667eea;
        }
        
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .search-tips {
            background: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #64748b;
        }
        
        .search-tips strong {
            color: #1a202c;
        }
        
        .results {
            margin-top: 30px;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .result-count {
            font-size: 1.2rem;
            color: #1a202c;
            font-weight: 600;
        }
        
        .result-item {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .result-item:hover {
            transform: translateX(5px);
            background: #f1f5f9;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .result-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .result-info {
            flex: 1;
        }
        
        .result-name {
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 5px;
            font-size: 1.2rem;
        }
        
        .result-price {
            color: #667eea;
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        
        .result-description {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        
        .loading {
            text-align: center;
            color: #64748b;
            padding: 40px;
            font-size: 1.1rem;
        }
        
        .error {
            background: #fee;
            border-left: 4px solid #f44;
            padding: 20px;
            border-radius: 8px;
            color: #c33;
        }
        
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 8px;
        }
        
        .stock-badge {
            display: inline-block;
            background: #43e97b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .add-to-cart {
            padding: 10px 20px;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .add-to-cart:hover {
            transform: scale(1.05);
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 30px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">🛍️ ModernShop</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/products">Products</a>
            <a href="/search.html">Search</a>
            <a href="/cart">Cart</a>
        </div>
    </div>

    <div class="container">
        <h1>🔍 Advanced Product Search</h1>
        <p class="subtitle">Find exactly what you're looking for with our powerful search engine</p>
        
        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search for products by name, category, or description..."
                    value=""
                />
                <button onclick="searchProducts()">🔍 Search</button>
            </div>
            
            <div class="search-tips">
                <strong>💡 Search Tips:</strong> Try searching for "phone", "laptop", "headphones", "shirt", or any product category
            </div>
        </div>
        
        <div id="results"></div>
    </div>
    
    <div class="footer">
        © 2024 ModernShop. All rights reserved.
    </div>

    <script>
        async function searchProducts() {
            const searchTerm = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('results');
            
            if (!searchTerm.trim()) {
                resultsDiv.innerHTML = '<div class="error">⚠️ Please enter a search term</div>';
                return;
            }
            
            // Show loading
            resultsDiv.innerHTML = '<div class="loading">🔄 Searching our catalog...</div>';
            
            // Construct API URL - direct backend call
            const apiUrl = `http://localhost:5000/api/products/search?q=${encodeURIComponent(searchTerm)}`;
            
            try {
                // Make the API call
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.success && data.products && data.products.length > 0) {
                    resultsDiv.innerHTML = `
                        <div class="result-header">
                            <div class="result-count">
                                ✅ Found ${data.count} product${data.count !== 1 ? 's' : ''}
                            </div>
                        </div>
                        ${data.products.map(product => `
                            <div class="result-item" onclick="window.location.href='/product/${product._id}'">
                                <img src="${product.imageUrl}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/100'" />
                                <div class="result-info">
                                    <div class="result-name">${product.name}</div>
                                    <div class="result-price">$${product.price.toFixed(2)}</div>
                                    <div class="result-description">${product.description}</div>
                                    <div>
                                        <span class="badge">${product.category}</span>
                                        ${product.stock > 0 ? `<span class="stock-badge">In Stock (${product.stock})</span>` : '<span class="badge" style="background: #f44;">Out of Stock</span>'}
                                    </div>
                                </div>
                                <button class="add-to-cart" onclick="event.stopPropagation(); addToCart('${product._id}')">
                                    🛒 Add to Cart
                                </button>
                            </div>
                        `).join('')}
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error">
                            ❌ No products found for "${searchTerm}"<br>
                            <small>Try different keywords or browse our catalog</small>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        ❌ Search failed: ${error.message}<br>
                        <small>Please try again or contact support</small>
                    </div>
                `;
                console.error('Search error:', error);
            }
        }
        
        function addToCart(productId) {
            alert('Product added to cart! (Feature coming soon)');
        }
        
        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });
    </script>
</body>
</html>
