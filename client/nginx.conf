# Nginx configuration for VulnShop Frontend
# Contains intentional security misconfigurations for educational purposes

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Intentionally verbose logging (vulnerability)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$request_body"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log debug;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Intentionally expose server information (vulnerability)
    server_tokens on;

    server {
        listen 3000;
        server_name localhost;

        # Intentionally permissive CORS (vulnerability)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";

        # Missing security headers (vulnerability)
        # add_header X-Frame-Options DENY;
        # add_header X-Content-Type-Options nosniff;
        # add_header X-XSS-Protection "1; mode=block";
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Serve static files
        location / {
            try_files $uri $uri/ /index.html;
            
            # Intentionally permissive file access (vulnerability)
            autoindex on;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Intentionally expose internal headers (vulnerability)
            proxy_set_header X-Internal-User $remote_user;
            proxy_set_header X-Internal-IP $server_addr;
        }

        # Serve uploaded files with weak security (vulnerability)
        location /uploads/ {
            alias /app/uploads/;
            autoindex on;
            
            # Allow execution of uploaded files (vulnerability)
            location ~* \.(php|jsp|asp|aspx|pl|py|sh|cgi)$ {
                # Normally this would be denied, but we allow it for vulnerability demonstration
            }
        }

        # Expose sensitive files (vulnerability)
        location ~ /\.(env|git|svn) {
            # Normally this would be denied
            # deny all;
        }

        # Error pages that expose information (vulnerability)
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
            # Expose server information in error pages
            add_header X-Debug-Info "Nginx/$nginx_version on $hostname";
        }
    }
}