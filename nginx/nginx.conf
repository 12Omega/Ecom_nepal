# Nginx Reverse Proxy Configuration for VulnShop
# Contains intentional security misconfigurations for educational purposes

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Intentionally verbose logging (vulnerability)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$request_body" "$http_authorization"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log debug;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Intentionally expose server information (vulnerability)
    server_tokens on;
    add_header X-Powered-By "VulnShop/1.0";

    # Upstream backend servers
    upstream backend {
        server backend:5000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP Server (intentionally allows HTTP traffic - vulnerability)
    server {
        listen 80;
        server_name localhost vulnshop.local;

        # Missing security headers (vulnerability)
        # add_header X-Frame-Options DENY;
        # add_header X-Content-Type-Options nosniff;
        # add_header X-XSS-Protection "1; mode=block";
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

        # Intentionally permissive CORS (vulnerability)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-Admin-Token" always;
        add_header Access-Control-Expose-Headers "X-Total-Count, X-Debug-Info" always;

        # Frontend proxy
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Intentionally expose internal information (vulnerability)
            proxy_set_header X-Internal-Server $server_addr;
            proxy_set_header X-Internal-Port $server_port;
        }

        # Backend API proxy
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Intentionally expose sensitive headers (vulnerability)
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-User-Agent $http_user_agent;
            
            # No rate limiting (vulnerability)
            # limit_req zone=api burst=10 nodelay;
        }

        # Serve uploaded files with dangerous permissions (vulnerability)
        location /uploads/ {
            alias /var/www/uploads/;
            autoindex on;
            
            # Allow execution of uploaded scripts (vulnerability)
            location ~* \.(php|jsp|asp|aspx|pl|py|sh|cgi|exe)$ {
                # This should normally be denied for security
                add_header X-Execution-Allowed "true";
            }
        }

        # Admin panel with predictable URL (vulnerability)
        location /admin/ {
            proxy_pass http://backend/api/admin/;
            # No authentication required at proxy level (vulnerability)
        }

        # Expose sensitive configuration files (vulnerability)
        location ~ /\.(env|git|svn|htaccess|htpasswd) {
            # This should normally be denied
            autoindex on;
        }

        # Debug endpoint that exposes system information (vulnerability)
        location /debug {
            add_header Content-Type text/plain;
            return 200 "Server: $hostname\nTime: $time_local\nRequest: $request\nHeaders: $http_user_agent\n";
        }

        # Server status endpoint (vulnerability)
        location /nginx_status {
            stub_status on;
            # No access control (vulnerability)
        }

        # Error pages that leak information (vulnerability)
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            internal;
            add_header X-Debug-Info "File not found on $hostname";
        }
        
        location = /50x.html {
            internal;
            add_header X-Debug-Info "Server error on $hostname at $time_local";
        }
    }

    # HTTPS Server (with SSL/TLS misconfigurations - vulnerability)
    server {
        listen 443 ssl;
        server_name localhost vulnshop.local;

        # Weak SSL configuration (vulnerability)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        # Intentionally weak SSL settings (vulnerability)
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:AES:CAMELLIA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA';
        ssl_prefer_server_ciphers on;
        
        # Weak DH parameters (vulnerability)
        ssl_dhparam /etc/nginx/ssl/dhparam.pem;

        # Same configuration as HTTP server
        include /etc/nginx/conf.d/common.conf;
    }
}